name: assemble-lockfile
on:
  workflow_dispatch:
  push:
    paths:
      - "lockfile-parts/**"
      - ".github/workflows/assemble-lockfile.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replit-complete-app
      - name: Concatenate parts into pnpm-lock.yaml
        run: |
          set -euo pipefail
          if [ ! -d lockfile-parts ]; then
            echo "no lockfile-parts yet"
            exit 0
          fi
          cat lockfile-parts/part-* > pnpm-lock.yaml
          echo "----- head -----"
          head -n 3 pnpm-lock.yaml
          test "$(head -n 1 pnpm-lock.yaml)" = "lockfileVersion: '9.0'"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "no lockfile change"
            exit 0
          fi
          git commit -m "chore: regenerate pnpm-lock.yaml for brace-expansion overrides"
          git push origin replit-complete-app

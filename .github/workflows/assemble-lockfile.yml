name: assemble-lockfile
on:
  workflow_dispatch:
jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replit-complete-app
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and write lockfile
        run: |
          set -euo pipefail
          pnpm install --lockfile-only || pnpm install --no-frozen-lockfile
          head -n 3 pnpm-lock.yaml
          test "$(head -n 1 pnpm-lock.yaml)" = "lockfileVersion: '9.0'"
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile unchanged"
            exit 0
          fi
          git commit -m "chore: regenerate pnpm-lock.yaml for brace-expansion overrides"
          git push origin HEAD:replit-complete-app

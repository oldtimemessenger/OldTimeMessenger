openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone verification and sessions
  - name: users
    description: People and inbox data
  - name: chats
    description: Direct conversations and messages
  - name: storage
    description: Private media upload and serving
  - name: social
    description: Persisted Updates feed, relationships, conversations, and moderation
  - name: map
    description: Opt-in location pins and nearby discovery
  - name: current-events
    description: Voice-only live rooms for current events
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      security: []
      operationId: readinessCheck
      tags: [health]
      summary: Production dependency readiness
      description: Confirms database, storage, session secret, and SMS verification configuration.
      responses:
        "200":
          description: Ready for real users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A production dependency is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/request-otp:
    post:
      security: []
      operationId: requestOtp
      tags: [auth]
      summary: Send a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-otp:
    post:
      security: []
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a phone code and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Verified user
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticatedUser"
                  - $ref: "#/components/schemas/BirthdayRequiredResponse"
        "400":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/complete-birthday:
    post:
      security: []
      operationId: completeBirthday
      tags: [auth]
      summary: Complete age verification after phone verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteBirthdayBody"
      responses:
        "200":
          description: Age-verified user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "400":
          description: Invalid or expired age-verification challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is under the minimum age
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users available to message
      parameters:
        - $ref: "#/components/parameters/ViewerId"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /users/{userId}/presence-privacy:
    put:
      operationId: updatePresencePrivacy
      tags: [users]
      summary: Update online and last-seen visibility
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lastSeenVisible: { type: boolean }
              required: [lastSeenVisible]
      responses:
        "200":
          description: Presence privacy updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  lastSeenVisible: { type: boolean }
                required: [success, lastSeenVisible]
  /users/{userId}/presence:
    put:
      operationId: updatePresence
      tags: [users]
      summary: Update the caller's online presence
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                online: { type: boolean }
              required: [online]
      responses:
        "200":
          description: Presence updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  online: { type: boolean }
                  lastSeen: { type: number }
                required: [success, online, lastSeen]
  /users/{userId}/profile:
    put:
      operationId: updateUserProfile
      tags: [users]
      summary: Update the signed-in user's identity and contact settings
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                username:
                  type: string
                  minLength: 3
                  maxLength: 24
                  pattern: "^[a-zA-Z0-9_]+$"
                bio:
                  type: string
                  maxLength: 150
                birthday:
                  type: string
                  format: date
                  description: Private date of birth; only returned to the signed-in user
                contactPermission:
                  type: string
                  enum: [everyone, followers, nobody]
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{userId}/inbox:
    get:
      operationId: getInbox
      tags: [users]
      summary: Get the viewer's inbox previews
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Inbox previews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxItem"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats/direct/{userOneId}/{userTwoId}:
    get:
      operationId: getDirectChat
      tags: [chats]
      summary: Find or create a direct chat preview
      parameters:
        - $ref: "#/components/parameters/UserOneId"
        - $ref: "#/components/parameters/UserTwoId"
      responses:
        "200":
          description: Direct chat preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectChat"
        "400":
          description: Invalid users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats:
    post:
      operationId: createChat
      tags: [chats]
      summary: Create a direct chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "201":
          description: Created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          description: Invalid participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats/{chatId}/messages:
    get:
      operationId: listMessages
      tags: [chats]
      summary: List messages in a chat
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - name: viewerId
          in: query
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "403":
          description: Viewer is not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMessage
      tags: [chats]
      summary: Send a message
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sender is not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats/{chatId}/read:
    post:
      operationId: markChatRead
      tags: [chats]
      summary: Mark another user's messages as read
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadInput"
      responses:
        "200":
          description: Read count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
        "403":
          description: Viewer is not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages/{messageId}/open:
    post:
      operationId: openMessage
      tags: [chats]
      summary: Open a received message and begin its retention period
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageActionInput"
      responses:
        "200":
          description: Opened message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Only the recipient may open this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages/{messageId}/save:
    post:
      operationId: saveMessage
      tags: [chats]
      summary: Save a received message permanently
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageActionInput"
      responses:
        "200":
          description: Saved message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Only the recipient may save this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /social/feed:
    get:
      operationId: getSocialFeed
      tags: [social]
      summary: Get a ranked For You feed, a relationship-filtered Community feed, or a following-only feed
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [for-you, following, community]
            default: for-you
        - name: filter
          in: query
          description: Community-only filter. Community posts never enter the For You feed.
          schema:
            type: string
            enum: [friends, following, interests]
            default: friends
        - name: interests
          in: query
          description: Comma-separated selected interest IDs used when filter is interests.
          schema:
            type: string
        - name: mediaOnly
          in: query
          description: Return only photo and video posts for the creator Updates surface.
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 30
            default: 20
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialFeedPage"
  /social/posts:
    post:
      operationId: createSocialPost
      tags: [social]
      summary: Publish a social post as the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialPostInput"
      responses:
        "201":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPost"
  /social/posts/{postId}:
    delete:
      operationId: deleteSocialPost
      tags: [social]
      summary: Delete a post owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /social/posts/{postId}/like:
    put:
      operationId: likeSocialPost
      tags: [social]
      summary: Like a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Like saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: unlikeSocialPost
      tags: [social]
      summary: Remove a post like
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Like removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/posts/{postId}/repost:
    put:
      operationId: repostSocialPost
      tags: [social]
      summary: Repost a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Repost saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: removeSocialRepost
      tags: [social]
      summary: Remove a repost
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Repost removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/posts/{postId}/save:
    put:
      operationId: saveSocialPost
      tags: [social]
      summary: Save a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Save stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: removeSavedSocialPost
      tags: [social]
      summary: Remove a saved post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Save removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/posts/{postId}/comments:
    get:
      operationId: getSocialPostComments
      tags: [social]
      summary: List comments and replies for a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialComment"
    post:
      operationId: createSocialPostComment
      tags: [social]
      summary: Comment on or reply to a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialComment"
  /social/comments/{commentId}:
    delete:
      operationId: deleteSocialComment
      tags: [social]
      summary: Delete a comment owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /social/comments/{commentId}/like:
    put:
      operationId: likeSocialComment
      tags: [social]
      summary: Like a comment
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Like saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: unlikeSocialComment
      tags: [social]
      summary: Remove a comment like
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Like removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/users/search:
    get:
      operationId: searchSocial
      tags: [social]
      summary: Search visible users and posts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialSearchResults"
  /social/users/{userId}/card:
    get:
      operationId: getSocialUserCard
      tags: [social]
      summary: Get a compact social identity card
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Compact user card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialUserCard"
  /social/users/{userId}/posts:
    get:
      operationId: getSocialUserPosts
      tags: [social]
      summary: List visible posts from a social user's profile
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 24
      responses:
        "200":
          description: Visible profile posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPostList"
  /social/users/{userId}/follow:
    put:
      operationId: followSocialUser
      tags: [social]
      summary: Follow a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowActionResult"
    delete:
      operationId: unfollowSocialUser
      tags: [social]
      summary: Unfollow a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowActionResult"
  /social/message-requests:
    get:
      operationId: listMessageRequests
      tags: [social]
      summary: List pending incoming or outgoing social message requests
      parameters:
        - name: box
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing]
            default: incoming
      responses:
        "200":
          description: Pending message requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRequestList"
  /social/message-requests/to/{userId}:
    post:
      operationId: createMessageRequest
      tags: [social]
      summary: Request a conversation with a social user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: Message request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRequest"
  /social/message-requests/{requestId}/accept:
    put:
      operationId: acceptMessageRequest
      tags: [social]
      summary: Accept a message request and create the main chat
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRequestAcceptResult"
  /social/message-requests/{requestId}:
    delete:
      operationId: declineMessageRequest
      tags: [social]
      summary: Decline a pending message request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Request declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /social/privacy/exclusions:
    get:
      operationId: getSocialPrivacyExclusions
      tags: [social]
      summary: List people excluded from the signed-in user's social sharing
      responses:
        "200":
          description: Excluded people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialUserList"
  /social/privacy/exclusions/{userId}:
    put:
      operationId: excludeSocialPrivacyUser
      tags: [social]
      summary: Exclude a person from all social and location sharing
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Person excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: includeSocialPrivacyUser
      tags: [social]
      summary: Remove a person from social and location sharing exclusions
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Person included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/users/{userId}/block:
    put:
      operationId: blockSocialUser
      tags: [social]
      summary: Block a user and remove follow relationships
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockActionResult"
    delete:
      operationId: unblockSocialUser
      tags: [social]
      summary: Unblock a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockActionResult"
  /social/users/{userId}/mute:
    put:
      operationId: muteSocialUser
      tags: [social]
      summary: Remove a user's content from personalized feeds
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Muted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteActionResult"
    delete:
      operationId: unmuteSocialUser
      tags: [social]
      summary: Restore a user's content to personalized feeds
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Unmuted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteActionResult"
  /social/reports:
    post:
      operationId: reportSocialContent
      tags: [social]
      summary: Submit a moderation report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialReportInput"
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /social/saved:
    get:
      operationId: getSavedSocialPosts
      tags: [social]
      summary: List posts saved by the authenticated user
      responses:
        "200":
          description: Saved posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPostList"
  /social/stories:
    get:
      operationId: getStories
      tags: [social]
      summary: List active stories visible to the caller
      responses: { "200": { description: Stories, content: { application/json: { schema: { $ref: "#/components/schemas/StoryList" } } } } }
    post:
      operationId: createStory
      tags: [social]
      summary: Publish an expiring text or protected-media story
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StoryInput" } } } }
      responses: { "201": { description: Story, content: { application/json: { schema: { $ref: "#/components/schemas/Story" } } } } }
  /social/notes:
    get:
      operationId: getNotes
      tags: [social]
      summary: List Notes visible in Messages and active in chats
      parameters:
        - { name: surface, in: query, required: false, schema: { type: string, enum: [messages, chat], default: messages } }
      responses: { "200": { description: Notes, content: { application/json: { schema: { $ref: "#/components/schemas/NoteList" } } } } }
    post:
      operationId: createNote
      tags: [social]
      summary: Create or replace the current user's Note
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } } }
      responses: { "201": { description: Note, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } } }
  /social/notes/{noteId}:
    patch:
      operationId: updateNote
      tags: [social]
      summary: Update a Note owned by the caller
      parameters: [{ name: noteId, in: path, required: true, schema: { type: number, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } } }
      responses: { "200": { description: Note, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } } }
    delete:
      operationId: deleteNote
      tags: [social]
      summary: Delete a Note owned by the caller
      parameters: [{ name: noteId, in: path, required: true, schema: { type: number, minimum: 1 } }]

  /current-events/rooms:
    get:
      operationId: getCurrentEventRooms
      tags: [current-events]
      summary: List live Current Events rooms
      parameters:
        - { name: topic, in: query, required: false, schema: { $ref: "#/components/schemas/CurrentEventTopic" } }
        - { name: latitude, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, required: false, schema: { type: number, minimum: 0.1, maximum: 50, default: 25 } }
      responses:
        "200":
          description: Live rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventRoomList"
    post:
      operationId: createCurrentEventRoom
      tags: [current-events]
      summary: Start a live Current Events room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentEventRoomInput"
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventRoom"
  /current-events/rooms/{roomId}:
    get:
      operationId: getCurrentEventRoom
      tags: [current-events]
      summary: Get a live Current Events room
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventRoom"
  /current-events/rooms/{roomId}/join:
    post:
      operationId: joinCurrentEventRoom
      tags: [current-events]
      summary: Join a room as a listener
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventRoom"
  /current-events/rooms/{roomId}/leave:
    post:
      operationId: leaveCurrentEventRoom
      tags: [current-events]
      summary: Leave a live room
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: Left room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /current-events/rooms/{roomId}/hand:
    post:
      operationId: setCurrentEventHand
      tags: [current-events]
      summary: Raise or lower the caller's hand
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentEventHandInput"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventRoom"
  /current-events/rooms/{roomId}/participants/{participantId}:
    patch:
      operationId: updateCurrentEventParticipant
      tags: [current-events]
      summary: Promote, demote, mute, or remove a participant
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
        - { name: participantId, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentEventParticipantAction"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventRoom"
  /current-events/rooms/{roomId}/messages:
    get:
      operationId: getCurrentEventMessages
      tags: [current-events]
      summary: List text messages for a room
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: Room messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventMessageList"
    post:
      operationId: createCurrentEventMessage
      tags: [current-events]
      summary: Send a text message in a room
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentEventMessageInput"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventMessage"
  /current-events/rooms/{roomId}/gifts:
    post:
      operationId: sendCurrentEventGift
      tags: [current-events]
      summary: Send a coin gift to a room speaker
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentEventGiftInput"
      responses:
        "200":
          description: Gift result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventGiftResult"
  /current-events/wallet:
    get:
      operationId: getCurrentEventWallet
      tags: [current-events]
      summary: Get the caller's Current Events coins and Gold
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventWallet"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a protected media upload endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a protected message attachment
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "403":
          description: Caller cannot access this object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserOneId:
      name: userOneId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserTwoId:
      name: userTwoId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    ViewerId:
      name: viewerId
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    PinId:
      name: pinId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    StoryId:
      name: storyId
      in: path
      required: true
      schema: { type: number, minimum: 1 }
    HighlightId:
      name: highlightId
      in: path
      required: true
      schema: { type: number, minimum: 1 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: number, minimum: 1 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          maxLength: 24
      required: [phone]
    OtpVerification:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          maxLength: 24
        otp:
          type: string
          minLength: 4
          maxLength: 10
        challengeId:
          type: string
          minLength: 1
      required: [phone, otp, challengeId]
    OtpResponse:
      type: object
      properties:
        success:
          type: boolean
        challengeId:
          type: string
        expiresAt:
          type: number
      required: [success, challengeId, expiresAt]
    BirthdayRequiredResponse:
      type: object
      properties:
        requiresBirthday:
          type: boolean
        challengeId:
          type: string
      required: [requiresBirthday, challengeId]
    CompleteBirthdayBody:
      type: object
      properties:
        challengeId:
          type: string
          minLength: 1
        birthday:
          type: string
          format: date
      required: [challengeId, birthday]
    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    User:
      type: object
      properties:
        id:
          type: number
        phone:
          type: string
        name:
          type: string
        username:
          type: string
        bio:
          type: string
        birthday:
          type: [string, "null"]
          format: date
          description: Private date of birth; null for other users
        contactPermission:
          type: string
          enum: [everyone, followers, nobody]
        online:
          type: boolean
        lastSeen:
          type: number
        lastSeenVisible:
          type: boolean
      required: [id, phone, name, username, bio, birthday, contactPermission, online, lastSeen, lastSeenVisible]
    AuthenticatedUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            authToken:
              type: string
          required: [authToken]
    Attachment:
      type: object
      properties:
        type:
          type: string
          enum: [image, video, file]
        objectPath:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        width:
          type: number
          minimum: 1
        height:
          type: number
          minimum: 1
        duration:
          type: number
          minimum: 0
      required: [type, objectPath, name, mimeType, size]
    Message:
      type: object
      properties:
        id:
          type: number
        chatId:
          type: number
        senderId:
          type: number
        content:
          type: string
        timestamp:
          type: number
        read:
          type: boolean
        attachment:
          anyOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        openedAt:
          anyOf:
            - type: number
            - type: "null"
        expiresAt:
          anyOf:
            - type: number
            - type: "null"
        saved:
          type: boolean
      required: [id, chatId, senderId, content, timestamp, read, attachment, openedAt, expiresAt, saved]
    Chat:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        isGroup:
          type: boolean
        createdAt:
          type: number
        participantIds:
          type: array
          items:
            type: number
      required: [id, name, isGroup, createdAt, participantIds]
    DirectChat:

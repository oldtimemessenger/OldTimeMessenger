openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone verification and sessions
  - name: users
    description: People and inbox data
  - name: chats
    description: Direct conversations and messages
  - name: storage
    description: Private media upload and serving
  - name: social
    description: Persisted Updates feed, relationships, conversations, and moderation
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      security: []
      operationId: readinessCheck
      tags: [health]
      summary: Production dependency readiness
      description: Confirms database, storage, session secret, and SMS verification configuration.
      responses:
        "200":
          description: Ready for real users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A production dependency is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/request-otp:
    post:
      security: []
      operationId: requestOtp
      tags: [auth]
      summary: Send a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-otp:
    post:
      security: []
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a phone code and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Verified user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "400":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users available to message
      parameters:
        - $ref: "#/components/parameters/ViewerId"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /users/{userId}/inbox:
    get:
      operationId: getInbox
      tags: [users]
      summary: Get the viewer's inbox previews
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Inbox previews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxItem"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats/direct/{userOneId}/{userTwoId}:
    get:
      operationId: getDirectChat
      tags: [chats]
      summary: Find or create a direct chat preview
      parameters:
        - $ref: "#/components/parameters/UserOneId"
        - $ref: "#/components/parameters/UserTwoId"
      responses:
        "200":
          description: Direct chat preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectChat"
        "400":
          description: Invalid users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats:
    post:
      operationId: createChat
      tags: [chats]
      summary: Create a direct chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "201":
          description: Created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          description: Invalid participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats/{chatId}/messages:
    get:
      operationId: listMessages
      tags: [chats]
      summary: List messages in a chat
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - name: viewerId
          in: query
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "403":
          description: Viewer is not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMessage
      tags: [chats]
      summary: Send a message
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sender is not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chats/{chatId}/read:
    post:
      operationId: markChatRead
      tags: [chats]
      summary: Mark another user's messages as read
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadInput"
      responses:
        "200":
          description: Read count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
        "403":
          description: Viewer is not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages/{messageId}/open:
    post:
      operationId: openMessage
      tags: [chats]
      summary: Open a received message and begin its retention period
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageActionInput"
      responses:
        "200":
          description: Opened message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Only the recipient may open this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages/{messageId}/save:
    post:
      operationId: saveMessage
      tags: [chats]
      summary: Save a received message permanently
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageActionInput"
      responses:
        "200":
          description: Saved message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Only the recipient may save this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /social/feed:
    get:
      operationId: getSocialFeed
      tags: [social]
      summary: Get a ranked or following-only Updates feed
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [for-you, following]
            default: for-you
        - name: cursor
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 30
            default: 20
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialFeedPage"
  /social/posts:
    post:
      operationId: createSocialPost
      tags: [social]
      summary: Publish a social post as the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialPostInput"
      responses:
        "201":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPost"
  /social/posts/{postId}:
    delete:
      operationId: deleteSocialPost
      tags: [social]
      summary: Delete a post owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /social/posts/{postId}/like:
    put:
      operationId: likeSocialPost
      tags: [social]
      summary: Like a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Like saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: unlikeSocialPost
      tags: [social]
      summary: Remove a post like
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Like removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/posts/{postId}/repost:
    put:
      operationId: repostSocialPost
      tags: [social]
      summary: Repost a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Repost saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: removeSocialRepost
      tags: [social]
      summary: Remove a repost
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Repost removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/posts/{postId}/save:
    put:
      operationId: saveSocialPost
      tags: [social]
      summary: Save a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Save stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: removeSavedSocialPost
      tags: [social]
      summary: Remove a saved post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Save removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/posts/{postId}/comments:
    get:
      operationId: getSocialPostComments
      tags: [social]
      summary: List comments and replies for a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialComment"
    post:
      operationId: createSocialPostComment
      tags: [social]
      summary: Comment on or reply to a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialComment"
  /social/comments/{commentId}:
    delete:
      operationId: deleteSocialComment
      tags: [social]
      summary: Delete a comment owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /social/comments/{commentId}/like:
    put:
      operationId: likeSocialComment
      tags: [social]
      summary: Like a comment
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Like saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
    delete:
      operationId: unlikeSocialComment
      tags: [social]
      summary: Remove a comment like
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Like removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveActionResult"
  /social/users/search:
    get:
      operationId: searchSocial
      tags: [social]
      summary: Search visible users and posts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialSearchResults"
  /social/users/{userId}/card:
    get:
      operationId: getSocialUserCard
      tags: [social]
      summary: Get a compact social identity card
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Compact user card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialUserCard"
  /social/users/{userId}/follow:
    put:
      operationId: followSocialUser
      tags: [social]
      summary: Follow a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowActionResult"
    delete:
      operationId: unfollowSocialUser
      tags: [social]
      summary: Unfollow a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowActionResult"
  /social/users/{userId}/block:
    put:
      operationId: blockSocialUser
      tags: [social]
      summary: Block a user and remove follow relationships
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockActionResult"
    delete:
      operationId: unblockSocialUser
      tags: [social]
      summary: Unblock a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockActionResult"
  /social/users/{userId}/mute:
    put:
      operationId: muteSocialUser
      tags: [social]
      summary: Remove a user's content from personalized feeds
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Muted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteActionResult"
    delete:
      operationId: unmuteSocialUser
      tags: [social]
      summary: Restore a user's content to personalized feeds
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Unmuted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteActionResult"
  /social/reports:
    post:
      operationId: reportSocialContent
      tags: [social]
      summary: Submit a moderation report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialReportInput"
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /social/saved:
    get:
      operationId: getSavedSocialPosts
      tags: [social]
      summary: List posts saved by the authenticated user
      responses:
        "200":
          description: Saved posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPostList"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a protected media upload endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a protected message attachment
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "403":
          description: Caller cannot access this object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserOneId:
      name: userOneId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserTwoId:
      name: userTwoId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    ViewerId:
      name: viewerId
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: number
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          maxLength: 24
      required: [phone]
    OtpVerification:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          maxLength: 24
        otp:
          type: string
          minLength: 4
          maxLength: 10
        challengeId:
          type: string
          minLength: 1
      required: [phone, otp, challengeId]
    OtpResponse:
      type: object
      properties:
        success:
          type: boolean
        challengeId:
          type: string
        expiresAt:
          type: number
      required: [success, challengeId, expiresAt]
    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    User:
      type: object
      properties:
        id:
          type: number
        phone:
          type: string
        name:
          type: string
        online:
          type: boolean
        lastSeen:
          type: number
      required: [id, phone, name, online, lastSeen]
    AuthenticatedUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            authToken:
              type: string
          required: [authToken]
    Attachment:
      type: object
      properties:
        type:
          type: string
          enum: [image, video, file]
        objectPath:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        width:
          type: number
          minimum: 1
        height:
          type: number
          minimum: 1
        duration:
          type: number
          minimum: 0
      required: [type, objectPath, name, mimeType, size]
    Message:
      type: object
      properties:
        id:
          type: number
        chatId:
          type: number
        senderId:
          type: number
        content:
          type: string
        timestamp:
          type: number
        read:
          type: boolean
        attachment:
          anyOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        openedAt:
          anyOf:
            - type: number
            - type: "null"
        expiresAt:
          anyOf:
            - type: number
            - type: "null"
        saved:
          type: boolean
      required: [id, chatId, senderId, content, timestamp, read, attachment, openedAt, expiresAt, saved]
    Chat:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        isGroup:
          type: boolean
        createdAt:
          type: number
        participantIds:
          type: array
          items:
            type: number
      required: [id, name, isGroup, createdAt, participantIds]
    DirectChat:
      type: object
      properties:
        chat:
          anyOf:
            - $ref: "#/components/schemas/Chat"
            - type: "null"
        lastMessage:
          anyOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
      required: [chat, lastMessage]
    InboxItem:
      type: object
      properties:
        chat:
          $ref: "#/components/schemas/Chat"
        contact:
          $ref: "#/components/schemas/User"
        lastMessage:
          anyOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unreadCount:
          type: number
      required: [chat, contact, lastMessage, unreadCount]
    ChatInput:
      type: object
      properties:
        userIds:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
      required: [userIds]
    MessageInput:
      type: object
      properties:
        senderId:
          type: number
        content:
          type: string
          maxLength: 2000
        attachment:
          $ref: "#/components/schemas/Attachment"
      required: [senderId]
      anyOf:
        - required: [content]
        - required: [attachment]
    MessageActionInput:
      type: object
      properties:
        recipientId:
          type: number
      required: [recipientId]
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required: [uploadURL, objectPath]
    ReadInput:
      type: object
      properties:
        viewerId:
          type: number
      required: [viewerId]
    ReadResult:
      type: object
      properties:
        updated:
          type: number
      required: [updated]
    SocialUser:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        username:
          type: string
      required: [id, name, username]
    SocialMedia:
      type: object
      properties:
        type:
          type: string
          enum: [image, video]
        objectPath:
          type: string
        mimeType:
          type: string
        width:
          type: number
        height:
          type: number
        duration:
          type: number
      required: [type, objectPath, mimeType]
    SocialPostCounts:
      type: object
      properties:
        likes:
          type: number
        comments:
          type: number
        reposts:
          type: number
        saves:
          type: number
      required: [likes, comments, reposts, saves]
    SocialPostViewer:
      type: object
      properties:
        liked:
          type: boolean
        reposted:
          type: boolean
        saved:
          type: boolean
        followingAuthor:
          type: boolean
      required: [liked, reposted, saved, followingAuthor]
    SocialNewsAttribution:
      type: object
      properties:
        source:
          type: string
        publishedAt:
          type: [number, "null"]
        url:
          type: string
      required: [source, publishedAt, url]
    SocialPost:
      type: object
      properties:
        id:
          type: number
        kind:
          type: string
          enum: [text, photo, video, link, news]
        content:
          type: string
        visibility:
          type: string
          enum: [public, friends, followers, private]
        media:
          type: array
          items:
            $ref: "#/components/schemas/SocialMedia"
        linkUrl:
          type: [string, "null"]
        linkTitle:
          type: [string, "null"]
        linkDescription:
          type: [string, "null"]
        linkImageUrl:
          type: [string, "null"]
        news:
          anyOf:
            - $ref: "#/components/schemas/SocialNewsAttribution"
            - type: "null"
        createdAt:
          type: number
        updatedAt:
          type: number
        author:
          $ref: "#/components/schemas/SocialUser"
        counts:
          $ref: "#/components/schemas/SocialPostCounts"
        viewer:
          $ref: "#/components/schemas/SocialPostViewer"
      required: [id, kind, content, visibility, media, linkUrl, linkTitle, linkDescription, linkImageUrl, news, createdAt, updatedAt, author, counts, viewer]
    SocialFeedPage:
      type: object
      properties:
        mode:
          type: string
          enum: [for-you, following]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SocialPost"
        nextCursor:
          type: [number, "null"]
      required: [mode, items, nextCursor]
    SocialPostList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SocialPost"
      required: [items]
    SocialPostInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
        kind:
          type: string
          enum: [text, photo, video, link, news]
          default: text
        visibility:
          type: string
          enum: [public, friends, followers, private]
          default: public
        media:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/SocialMedia"
        linkUrl:
          type: string
        linkTitle:
          type: string
          maxLength: 300
        linkDescription:
          type: string
          maxLength: 800
        linkImageUrl:
          type: string
    SocialComment:
      type: object
      properties:
        id:
          type: number
        postId:
          type: number
        authorId:
          type: number
        parentId:
          type: [number, "null"]
        content:
          type: string
        createdAt:
          type: number
        author:
          $ref: "#/components/schemas/SocialUser"
        liked:
          type: boolean
      required: [id, postId, authorId, parentId, content, createdAt, author, liked]
    SocialCommentInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
        parentId:
          type: [number, "null"]
      required: [content]
    SocialUserCard:
      allOf:
        - $ref: "#/components/schemas/SocialUser"
        - type: object
          properties:
            followerCount:
              type: number
            followingCount:
              type: number
            following:
              type: boolean
            muted:
              type: boolean
            canMessage:
              type: boolean
          required: [followerCount, followingCount, following, muted, canMessage]
    SocialSearchResults:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/SocialUser"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/SocialPost"
      required: [users, posts]
    SocialReportInput:
      type: object
      properties:
        targetType:
          type: string
          enum: [post, comment, user]
        targetId:
          type: number
          minimum: 1
        reason:
          type: string
          enum: [spam, harassment, hate, violence, sexual_content, misinformation, copyright, other]
        details:
          type: string
          maxLength: 1000
      required: [targetType, targetId, reason]
    ActionResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    ActiveActionResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            active:
              type: boolean
          required: [active]
    FollowActionResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            following:
              type: boolean
          required: [following]
    BlockActionResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            blocked:
              type: boolean
          required: [blocked]
    MuteActionResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            muted:
              type: boolean
          required: [muted]

